                </div>
                <nav class="navbar">
                        <div>
                                <a href="./index.html">Inicio</a>
                        </div>
                        <div>

                        </div>
                        <div class="menuCategorias">

        </header>
    <main class="main-reg">
        <div class="header-reg">
            <h1>Contacto</h1>
        </div>
        <div class="form-reg">
            <form action="" method="post">
                <label for="name-con">
                    Nombre:<br>
                    <input type="text" name="name" id="name-con" placeholder="Nombre" required pattern="\p{L}+(?: +\p{L}+)*" title="Solo se permiten letras y espacios">
                </label>
                <br>
                <label for="email-con">
                    Email:<br>
                    <input type="email" name="email" id="email-con" placeholder="Email" required>
                </label>
                <br>
                <label for="subject-con">
                    Asunto:<br>
                    <input type="text" name="subject" id="subject-con" placeholder="Asunto" required maxlength="60">
                </label>
                <br>
                <label for="message-con">
                    Mensaje:<br>
                    <textarea name="message" id="message-con" placeholder="Escribe tu mensaje" rows="6" required maxlength="500"></textarea>
                </label>
                <br>
                <div class="btn-reg">
                    <button type="reset">Borrar</button>
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </div>
    </main>
        <footer class="footerBottom">
                <div class="information">
                        <a href="./sobre-nosotros.html"><p><font color="#b3e3ee">Sobre Nosotros</font></p></a>
                        <p>Politicas</p>
                        <p>Cookies</p>
                        <p>
                                <a href="#"><img src="images/linkedin.png" alt="LinkedIn" width="30px"></a>
                                <a href="#"><img src="images/twitter.png" alt="Twitter" width="30px"></a>
                        </p>
                </div>
                <hr>
                <div class="socialNetworks">
                </div>
        </footer>
</body>
