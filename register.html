    <main class="access">
        <div class="main-reg">
                <div class="header-reg">
                <h2>Registre</h2>
                </div>
                <div class="form-reg">
                <form action="" method="post">
                        <label for="name-reg">
                        Nombre:<br>
                        <input type="text" name="name" id="name-reg" placeholder="Nombre" required pattern="\p{L}+(?: +\p{L}+)*" title="Solo se permiten letras y espacios">
                        </label>
                        <br>
                        <label for="email-reg">
                        Email:<br>
                        <input type="email" name="email" id="email-reg" placeholder="Email" required>
                        </label>
                        <br>
                        <label for="password-reg">
                        Contraseña:<br>
                        <input type="password" name="password" id="password-reg" placeholder="Contraseña" required pattern="[A-Za-z0-9]+" title="Solo letras y números">
                        </label>
                        <br>
                        <label for="direction-reg">
                        Dirección:<br>
                        <input type="text" name="direction" id="direction-reg" placeholder="Dirección" required maxlength="30">
                        </label>
                        <br>
                        <label for="population-reg">
                        Población:<br>
                        <input type="text" name="population" id="population-reg" placeholder="Población" required maxlength="30">
                        </label>
                        <br>
                        <label for="cp-reg">
                        Código Postal:<br>
                        <input type="text" name="cp" id="cp-reg" placeholder="Código Postal" required pattern="[0-9]{5}" maxlength="5" title="Introduce exactamente 5 dígitos">
                        </label>
                        <br>
                        <div class="btn-reg">
                        <button type="button">Volver</button>
                        <button type="submit">Registrarse</button>
                        </div>
                </form>
                </div>
        </div>
        <div class="main-log">
                <div class="header-reg">
                <h2>Iniciar Sesió</h2>
                </div>
                <div class="form-reg">
                <form action="" method="post">
                        <label for="email-log">
                        Email:<br>
                        <input type="email" name="email" id="email-log" placeholder="Email" required>
                        </label>
                        <br>
                        <label for="password-log">
                        Contraseña:<br>
                        <input type="password" name="password" id="password-log" placeholder="Contraseña" required pattern="[A-Za-z0-9]+" title="Solo letras y números">
                        </label>
                        <br>
                        <div class="btn-reg">
                        <button type="button">Volver</button>
                        <button type="submit">Iniciar sesión</button>
                        </div>
                </form>
                </div>
        </div>
    </main>
