<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>EagleDistrict</title>
</head>
<body>
    <main class="main-reg">
        <div>
            <h1>Login</h1>
        </div>
        <div class="form-reg">
            <form action="" method="post">
                <label for="">
                    Nombre: 
                    <input type="text" name="" id="">
                </label>
                <br>
                <label for="">
                    Email: 
                    <input type="email" name="" id="">
                </label>
                <br>
                <label for="">
                    Contraseña: 
                    <input type="password" name="" id="">
                </label>
                <br>
                <label for="">
                    Dirección: 
                    <input type="text" name="" id="">
                </label>
                <br>
                <label for="">
                    Población: 
                    <input type="text" name="" id="">
                </label>
                <br>
                <label for="">
                    Código Postal: 
                    <input type="text" name="" id="">
                </label>
                <br>
                <div class="btn-reg">
                    <button>Volver</button>
                    <button type="submit">Registrarse</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
